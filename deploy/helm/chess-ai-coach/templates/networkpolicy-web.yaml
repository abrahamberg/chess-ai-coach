{{- if .Values.networkPolicy.enabled }}
{{/* The SPA bundle is also served only through oauth2-proxy (architecture §11:
     "only oauth2-proxy is ingress-exposed"). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chess-ai-coach.componentName" (dict "ctx" . "component" "web") }}
  labels:
    {{- include "chess-ai-coach.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chess-ai-coach.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.containerPort }}
{{- end }}
