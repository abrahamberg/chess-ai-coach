{{- if .Values.api.autoscaling.enabled }}
{{/* architecture §11: "api: 2 replicas; HPA on CPU". */}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chess-ai-coach.componentName" (dict "ctx" . "component" "api") }}
  labels:
    {{- include "chess-ai-coach.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chess-ai-coach.componentName" (dict "ctx" . "component" "api") }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
