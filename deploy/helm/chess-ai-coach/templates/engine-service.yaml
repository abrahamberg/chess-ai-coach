apiVersion: v1
kind: Service
metadata:
  name: {{ include "chess-ai-coach.componentName" (dict "ctx" . "component" "engine") }}
  labels:
    {{- include "chess-ai-coach.labels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.engine.service.port }}
      targetPort: http
  selector:
    {{- include "chess-ai-coach.selectorLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
