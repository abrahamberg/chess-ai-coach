name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the apt-installed path Dockerfile.engine and
      # services/engine/test/helpers/stockfish-path.ts both expect.
      - name: Install stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # apps/api's suite spins up a real Postgres via Testcontainers; the
      # ubuntu-latest runner ships a working Docker daemon for that.
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker/Dockerfile.engine still runs apt-get/npm ci/tsc *inside* the
      # target-architecture build (docs/deploy-build.md), so cross-building
      # linux/arm64 here needs QEMU; setup-buildx-action's default builder
      # already uses the docker-container driver --push/--load need.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # scripts/build-images.sh is the one place the artifact/image build
      # order lives (docs/deploy-build.md) — never re-implement it inline.
      # No --registry/--push here: this job only proves the three images
      # build, it does not publish them.
      - run: scripts/build-images.sh

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - run: helm lint deploy/helm/chess-ai-coach -f deploy/helm/chess-ai-coach/values.example.yaml

      - run: deploy/helm/test.sh
